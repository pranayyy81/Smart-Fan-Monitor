  <text x="392" y="318" font-size="11" fill="#555" text-anchor="start">Wi-Fi via phone hotspot</text>
  <text x="112" y="174" font-weight="600">DHT11 sensor</text><text x="112" y="191" font-size="11" fill="#555">temp + humidity · GPIO 4</text>
  <text x="380" y="166" font-weight="700">ESP32 DevKit V1</text><text x="380" y="183" font-size="11">reads sensor every 2 s</text><text x="380" y="199" font-size="11">drives LEDs and buzzer</text>
  <text x="648" y="74" font-weight="600">Red LED</text><text x="648" y="91" font-size="11" fill="#555">above 30°C · GPIO 21</text>
  <text x="648" y="142" font-weight="600">Green LED</text><text x="648" y="159" font-size="11" fill="#555">30°C or below · GPIO 18</text>
  <text x="648" y="210" font-weight="600">Buzzer</text><text x="648" y="227" font-size="11" fill="#555">hot and fan off · GPIO 25</text>
  <text x="648" y="278" font-weight="600">Blue LED (fan)</text><text x="648" y="295" font-size="11" fill="#555">V3 switch · GPIO 26</text>
